name: Docker Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 构建 Docker 镜像（每次都构建以验证 Dockerfile 能编过）
      #    IMAGE_TAG: 把 git ref 名(tag 触发时是 tag 名,否则是分支名)烙进镜像,
      #    容器内 cat /opt/image-tag 可查,用于排查"这个镜像是哪个版本构建的"。
      - name: Build Docker image
        run: |
          docker build \
            --build-arg IMAGE_TAG="${GITHUB_REF_NAME:-latest}" \
            -t ghcr.io/${{ github.repository }}/harmonyos-ci-image:latest .

      # 3. 登录 GitHub Package Registry（仅在需要推送时）
      - name: Log in to GitHub Package Registry
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 推送 latest：只在手动 dispatch 时发布，避免每次 push main 都覆盖 latest
      - name: Push Docker image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/${{ github.repository }}/harmonyos-ci-image:latest

      # 5. 可选：推送 tag 时标记为特定版本
      - name: Tag and push versioned image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker tag ghcr.io/${{ github.repository }}/harmonyos-ci-image:latest ghcr.io/${{ github.repository }}/harmonyos-ci-image:$TAG
          docker push ghcr.io/${{ github.repository }}/harmonyos-ci-image:$TAG
